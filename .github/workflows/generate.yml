name: generate

# Runs when a job file is pushed (or by hand). Generates every job in jobs/ that has no outputs yet,
# then commits the images back to outputs/. GitHub-hosted runners have no GPU: this is CPU work,
# roughly 10-30 minutes per image.
on:
  push:
    branches: [main]
    paths: ['jobs/**', 'masks/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the model is 7 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (CPU build of PyTorch)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow

      - name: Download the model (RealVisXL V5.0, fp16 weights)
        run: |
          mkdir -p models
          curl -L --fail -s -o models/RealVisXL_V5.0_fp16.safetensors \
            https://huggingface.co/SG161222/RealVisXL_V5.0/resolve/main/RealVisXL_V5.0_fp16.safetensors
          ls -la models

      - name: Generate
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python run_jobs.py

      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Generated images [skip ci]"
          git pull --rebase --autostash
          git push
