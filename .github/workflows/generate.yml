name: generate

# Runs when a job file is pushed (or by hand). Generates every job in jobs/ that has no outputs yet,
# committing each image to outputs/ as soon as it is done. GitHub-hosted runners have no GPU: this is CPU work,
# roughly 10-30 minutes per image.
on:
  push:
    branches: [main]
    paths: ['jobs/**', 'masks/**']
  workflow_dispatch:
    inputs:
      job:
        description: 'Run only this job (file name in jobs/ without .json); empty = all'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: generate-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the model is 7 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Extra swap (the inpaint run was killed once at the RAM limit)
        run: |
          sudo fallocate -l 12G /extra.swap && sudo chmod 600 /extra.swap
          sudo mkswap /extra.swap && sudo swapon /extra.swap
          free -m

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install (CPU build of PyTorch)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers transformers accelerate safetensors pillow

      - name: Download the model (RealVisXL V5.0, fp16 weights)
        run: |
          mkdir -p models
          curl -L --fail -s -o models/RealVisXL_V5.0_fp16.safetensors \
            https://huggingface.co/SG161222/RealVisXL_V5.0/resolve/main/RealVisXL_V5.0_fp16.safetensors
          ls -la models

      - name: Generate
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          COMMIT_EACH: '1'
          ONLY_JOB: ${{ inputs.job }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # log memory every 10 s so a kill at the RAM limit is visible in the log
          ( while true; do free -m | awk 'NR==2{print "mem used " $3 " MB, available " $7 " MB"}'; sleep 10; done ) &
          python -u run_jobs.py

      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Generated images [skip ci]"
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep 10; done
